name: install-sh
on:
  pull_request:
    paths:
      - 'install.sh'
      - 'packaging/test/**'
      - '.github/workflows/install-sh.yml'
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: shellcheck
        run: shellcheck install.sh packaging/test/install_target.sh
      - name: target resolution
        run: sh packaging/test/install_target.sh
